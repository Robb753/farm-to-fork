name: CI

on:
  pull_request:
  push:
    branches: [master, main, codex/reconcile-config-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.9.0

      - name: Install
        run: npm ci --no-audit --no-fund

      # No production keys on PRs, including forks. This never deploys .next.
      - name: Lint, types, unit tests and isolated build
        run: npm run ci:check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      # Docker services are local to this runner; no Supabase account or token.
      - name: Start isolated Supabase
        run: npx --yes supabase@2.117.0 start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Reconstruct an empty local database
        run: npx --yes supabase@2.117.0 db reset --local --no-seed --yes
      - name: Verify catalog and visitor / A / B / admin permissions
        run: npm run db:check:supabase
      - name: Stop local services
        if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup
