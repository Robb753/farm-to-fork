# Isolated local development only. No linked project or production credentials.
project_id = "farm-to-fork-permissions"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.local.sql"]

[studio]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"

# Existing Clerk Development instance. Keep the application's "supabase" JWT
# template contract unchanged; no Clerk secret or production project setting here.
[auth.third_party.clerk]
enabled = true
domain = "humane-buffalo-60.clerk.accounts.dev"

[storage]
enabled = true
